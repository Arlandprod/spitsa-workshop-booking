# Example only: replace spitsa.example.com and copy dist to /srv/www/spitsa.
# Add HTTPS with your existing reverse proxy/certificate workflow before public use.
server {
    listen 80;
    server_name spitsa.example.com;
    root /srv/www/spitsa;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; }
}
